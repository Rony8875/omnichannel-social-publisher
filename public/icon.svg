<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="anantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Infinity loop (Anant) -->
  <path
    d="M20 40C14.7 40 10.5 35.8 10.5 30.5C10.5 25.2 14.7 21 20 21C27.2 21 35.2 40 42.4 40C47.7 40 51.9 35.8 51.9 30.5C51.9 25.2 47.7 21 42.4 21C35.2 21 27.2 40 20 40Z"
    stroke="url(#anantGrad)"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Broadcast pulse arc (Reach) -->
  <path
    d="M38 15C44 17 48.8 21.8 50.8 28"
    stroke="#06B6D4"
    stroke-width="3.2"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Connected nodes -->
  <circle cx="20.5" cy="30.5" r="3.2" fill="#10B981" />
  <circle cx="31.2" cy="30.5" r="3.2" fill="#06B6D4" />
  <circle cx="41.9" cy="30.5" r="3.2" fill="#818CF8" />
</svg>
